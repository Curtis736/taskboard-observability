apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: taskboard-obs
resources:
  - namespace.yaml
  - rbac.yaml
  - prometheus.yaml
  - grafana.yaml
  - grafana-provisioning.yaml
configMapGenerator:
  - name: prometheus-config
    files:
      - prometheus.yml
  - name: grafana-dashboards
    files:
      - taskboard.json
labels:
  - pairs:
      app.kubernetes.io/part-of: taskboard
    includeSelectors: false
