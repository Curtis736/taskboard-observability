global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: taskboard-api
    metrics_path: /metrics
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names:
            - taskboard
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_name]
        action: keep
        regex: taskboard-api
      - source_labels: [__meta_kubernetes_endpoint_port_name]
        action: keep
        regex: http
